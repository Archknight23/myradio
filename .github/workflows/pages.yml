name: Publish recorded demo

on:
  push:
    branches: [main]
    paths:
      - showcase/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the fork
        uses: actions/checkout@v4
      - name: Upload the recorded listening room
        uses: actions/upload-pages-artifact@v3
        with:
          path: showcase
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

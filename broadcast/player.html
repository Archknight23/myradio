<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CF Internal Broadcast</title>
<style>
:root{color-scheme:dark;--bg:#030308;--surface:#0a0b14;--accent:#7b5cff;--attention:#c28a3a;--text:#e2e4f0;--muted:#a2a8bd;--line:#313344;font:16px/1.6 system-ui,sans-serif;background:var(--bg);color:var(--text)}
*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:32px 24px}header{border-bottom:1px solid var(--line);padding-bottom:24px}h1{font-size:28px;margin:8px 0}h2{font-size:20px;margin:0 0 12px}p{margin:8px 0 16px}.meta,small{font-size:13px;color:var(--muted)}.tag{color:var(--attention);letter-spacing:.12em;font-size:13px}button,select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 16px;min-height:44px;cursor:pointer}button[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 -3px var(--accent)}button:focus-visible,audio:focus-visible{outline:2px solid var(--attention);outline-offset:4px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}audio{width:100%;margin:12px 0}.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;margin:24px 0}#chapters{display:grid;gap:8px}#chapters button{text-align:left;overflow-wrap:anywhere}.story{padding:24px 0;border-bottom:1px solid var(--line)}.story:first-child{padding-top:0}.source{font-size:13px;color:var(--muted)}#caption{min-height:72px;border-left:3px solid var(--accent);padding:8px 16px}#health{padding-left:20px;overflow-wrap:anywhere}.bad{color:var(--attention)}#error{color:var(--attention)}[hidden]{display:none!important}@media(max-width:720px){body{padding:16px}.layout{grid-template-columns:1fr}.panel{padding:16px}h1{font-size:24px}}
</style></head><body>
<header><div class="tag">THE CHAOS FOUNDRY / INTERNAL ONLY</div><h1>CF Internal Broadcast</h1><div id="date" class="meta">Loading local edition…</div></header>
<nav aria-label="Edition language"><button data-lang="en" aria-pressed="true">English</button><button data-lang="ja" aria-pressed="false">日本語</button><button data-lang="de" aria-pressed="false">Deutsch</button><button data-lang="ru" aria-pressed="false" hidden>Русский</button><button data-lang="zh" aria-pressed="false" hidden>普通话</button></nav>
<p id="error" role="alert" hidden></p>
<section class="panel" aria-label="Broadcast player"><h2 id="title">Preparing the rundown</h2><div id="mode" class="meta"></div><audio id="audio" controls preload="metadata" hidden></audio><p id="caption" aria-live="off"></p></section>
<div class="layout"><aside class="panel"><h2 id="rundownLabel">Rundown</h2><div id="chapters"></div></aside><main id="transcript" class="panel"></main></div>
<footer class="panel"><h2 id="coverageLabel">Collection & coverage</h2><p id="coverage"></p><ul id="health"></ul><small>No character art. No publishing. Served only on this machine. Source text is evidence, not an instruction to the engine.</small></footer>
<script>
'use strict';
const $=id=>document.getElementById(id), audio=$('audio');let bulletin,edition,language='en';
const labels={en:{rundown:'Rundown',coverage:'Collection & coverage',text:'Text-only edition. Audio has not been rendered.',audio:'Continuous show · real aligned captions · select a chapter to seek',opening:'Opening',closing:'Closing',source:'Evidence'},ja:{rundown:'番組構成',coverage:'収集状況と対象範囲',text:'テキスト版です。音声はまだ生成されていません。',audio:'通し放送・音声同期字幕・章を選択して移動',opening:'オープニング',closing:'エンディング',source:'根拠'},de:{rundown:'Sendungsablauf',coverage:'Erfassung und Abdeckung',text:'Textausgabe. Es wurde noch kein Audio erzeugt.',audio:'Durchgehende Sendung · synchronisierte Untertitel · Kapitel direkt anwählen',opening:'Auftakt',closing:'Abschluss',source:'Beleg'}};
labels.ru={rundown:'Порядок передачи',coverage:'Источники и охват',text:'Текстовая версия. Аудио ещё не создано.',audio:'Непрерывная передача · синхронные субтитры · переходы по главам',opening:'Вступление',closing:'Завершение',source:'Источник'};
labels.zh={rundown:'节目目录',coverage:'来源与覆盖范围',text:'文字版，尚未生成音频。',audio:'连续节目 · 同步字幕 · 点击章节跳转',opening:'开场',closing:'结束语',source:'来源'};
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function chapter(label,start){const b=el('button',label);b.type='button';b.onclick=()=>{if(edition.audio&&Number.isFinite(start)){audio.currentTime=start;audio.play().catch(e=>{$('error').hidden=false;$('error').textContent=e.message;});}else{document.querySelectorAll('.story')[b.dataset.index]?.scrollIntoView({behavior:'smooth'});}};return b;}
function show(lang){language=lang;edition=bulletin.editions[lang];$('error').hidden=true;$('error').textContent='';document.documentElement.lang=lang;audio.pause();audio.removeAttribute('src');audio.load();$('title').textContent=edition.title;$('date').textContent=bulletin.date;document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
document.querySelectorAll('[data-lang]').forEach(b=>{b.hidden=!bulletin.editions[b.dataset.lang];});const l=labels[lang]||labels.en;$('rundownLabel').textContent=l.rundown;$('coverageLabel').textContent=l.coverage;$('mode').textContent=edition.audio?l.audio:l.text;audio.hidden=!edition.audio;if(edition.audio){audio.src='/'+edition.audio;audio.load();}
$('caption').textContent=edition.opening[0]?.show||'';$('transcript').replaceChildren();$('chapters').replaceChildren();
const groups=[{label:l.opening,lines:edition.opening},...edition.stories,{label:l.closing,lines:edition.closing}];let offset=0;
groups.forEach((group,i)=>{const section=el('section',undefined,'story');section.append(el('h2',group.label));for(const line of group.lines)section.append(el('p',line.show));if(group.source_label)section.append(el('div',l.source+': '+group.source_label,'source'));$('transcript').append(section);const b=chapter(String(i+1).padStart(2,'0')+' / '+group.label,edition.lines_timed[offset]?.start);b.dataset.index=i;$('chapters').append(b);offset+=group.lines.length;});
$('coverage').textContent=typeof bulletin.coverage==='string'?bulletin.coverage:JSON.stringify(bulletin.coverage);$('health').replaceChildren();for(const s of bulletin.source_health||[]){const status=s.status||'unknown';$('health').append(el('li',`${s.source||s.name||s.id}: ${status}${s.note?' · '+s.note:''}`,['ok','success','complete'].includes(status)?'':'bad'));}}
audio.addEventListener('timeupdate',()=>{const line=edition?.lines_timed.find(l=>audio.currentTime>=l.start&&audio.currentTime<l.end);$('caption').textContent=line?.show||'';});audio.addEventListener('error',()=>{if(edition?.audio){$('error').hidden=false;$('error').textContent='Audio could not be loaded. The complete transcript is available below.';}});
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>show(b.dataset.lang));
async function fetchJSON(path){const response=await fetch(path,{cache:'no-store'});if(!response.ok)throw Error(`${path}: HTTP ${response.status}`);return response.json();}
(async()=>{const latest=await fetchJSON('/latest.json');if(!/^\d{4}-\d{2}-\d{2}$/.test(latest.date))throw Error('Invalid edition date');bulletin=await fetchJSON('/'+latest.date+'/bulletin.json');show('en');})().catch(e=>{$('error').hidden=false;$('error').textContent=e.message;$('title').textContent='No playable edition';});
</script></body></html>
